name: Update official bathing-water data

on:
  schedule:
    - cron: '43 2,8,14,20 * * *'
    - cron: '17 1 * * 0'
  workflow_dispatch:
    inputs:
      year:
        description: Season year
        required: true
        default: '2026'
      force:
        description: Force complete history refresh
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: update-official-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import target municipalities from JP Morsko dobro
        env:
          INPUT_YEAR: ${{ inputs.year }}
          FORCE_IMPORT: ${{ inputs.force }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          year="${INPUT_YEAR:-$(date -u +%Y)}"
          force_args=()
          if [ "$FORCE_IMPORT" = "true" ] || [ "$EVENT_SCHEDULE" = "17 1 * * 0" ]; then
            force_args+=(--force)
          fi
          npm run import:morsko -- --year="$year" "${force_args[@]}"

      - name: Detect official-data changes
        id: official
        run: |
          if git diff --quiet -- src/data/bathing_sites.json src/data/measurements.json src/data/dataset_metadata.json raw/morsko_dobro; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Open-Meteo context
        if: steps.official.outputs.changed == 'true'
        run: npm run update:weather

      - name: Validate data
        if: steps.official.outputs.changed == 'true'
        run: npm run validate:data

      - name: Test
        if: steps.official.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.official.outputs.changed == 'true'
        run: npm run build

      - name: Commit verified dataset
        if: steps.official.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data raw/morsko_dobro
          if git diff --cached --quiet; then
            echo "No official-data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update JP Morsko dobro data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated application
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
