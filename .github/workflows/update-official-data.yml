name: Update official bathing-water data

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: Season year
        required: true
        default: '2026'

permissions:
  actions: write
  contents: write

concurrency:
  group: update-official-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import target municipalities from JP Morsko dobro
        env:
          INPUT_YEAR: ${{ inputs.year }}
        run: |
          year="${INPUT_YEAR:-$(date -u +%Y)}"
          npm run import:morsko -- --year="$year"

      - name: Update Open-Meteo context
        run: npm run update:weather

      - name: Validate data
        run: npm run validate:data

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified dataset
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data raw/morsko_dobro
          if git diff --cached --quiet; then
            echo "No official-data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update JP Morsko dobro data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated application
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
