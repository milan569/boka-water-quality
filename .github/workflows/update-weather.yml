name: Update weather context

on:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update Open-Meteo context
        run: npm run update:weather

      - name: Validate data
        run: npm run validate:data

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit updated context
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/weather_context.json
          if git diff --cached --quiet; then
            echo "No weather changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Open-Meteo weather context"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated application
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
